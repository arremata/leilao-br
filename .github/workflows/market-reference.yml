name: Regional market references

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Database environment
        type: choice
        required: true
        default: staging
        options: [staging, Production]
      ufs:
        description: Comma-separated UFs (blank covers every active UF)
        required: false
        default: ""
      limit:
        description: Maximum regions to refresh
        required: true
        default: "10"
      property_id:
        description: Optional representative property ID for a targeted refresh
        required: false
        default: ""
      force:
        description: Refresh up to the limit even when jobs are not due
        type: boolean
        required: true
        default: false
  schedule:
    # GitHub cron uses UTC. Avoid the top of the hour, where GitHub documents
    # heavier scheduler load and possible delayed or dropped runs.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: regional-market-reference
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.target_environment || 'Production' }}
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      BRIGHT_DATA_WEB_UNLOCKER_ZONE: ${{ vars.BRIGHT_DATA_WEB_UNLOCKER_ZONE }}
      MARKET_UFS: ${{ github.event.inputs.ufs || '' }}
      MARKET_LIMIT: ${{ github.event.inputs.limit || '10' }}
      MARKET_PROPERTY_ID: ${{ github.event.inputs.property_id || '' }}
      MARKET_FORCE: ${{ github.event.inputs.force || 'false' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-market-worker.txt
      - run: pip install -r backend/requirements-market-worker.txt
      - name: Validate managed market-source configuration
        run: |
          test -n "$BRIGHT_DATA_API_KEY"
          test -n "$BRIGHT_DATA_WEB_UNLOCKER_ZONE"
          [[ "$MARKET_UFS" =~ ^$|^[A-Za-z]{2}(,[A-Za-z]{2})*$ ]]
          [[ "$MARKET_LIMIT" =~ ^[0-9]+$ ]]
          [[ -z "$MARKET_PROPERTY_ID" || "$MARKET_PROPERTY_ID" =~ ^[0-9]+$ ]]
          [[ "$MARKET_FORCE" =~ ^(true|false)$ ]]
      - name: Refresh missing or stale references
        working-directory: backend
        run: |
          args=(
            --ufs "$MARKET_UFS"
            --limit "$MARKET_LIMIT"
            --max-age-days 90
            --concurrency 2
            --result-file "$RUNNER_TEMP/market-reference-result.json"
          )
          if [[ -n "$MARKET_PROPERTY_ID" ]]; then
            args+=(--property-id "$MARKET_PROPERTY_ID")
          fi
          if [[ "$MARKET_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          timeout --signal=TERM --kill-after=30s 42m \
            python -m enrichment.market_reference "${args[@]}"
      - name: Materialize analyses affected by changed references
        if: ${{ always() }}
        working-directory: backend
        run: |
          result_file="$RUNNER_TEMP/market-reference-result.json"
          if [[ ! -s "$result_file" ]]; then
            echo "Collection did not produce a result file; skipping materialization."
            exit 0
          fi
          reference_ids="$(RESULT_FILE="$result_file" python -c \
            'import json, os; data=json.load(open(os.environ["RESULT_FILE"])); print(",".join(map(str, data["updated_reference_ids"])))')"
          if [[ -z "$reference_ids" ]]; then
            echo "No references changed; skipping materialization."
            exit 0
          fi
          timeout --signal=TERM --kill-after=30s 10m \
            python -m enrichment.materialize \
              --ufs "$MARKET_UFS" \
              --reference-ids "$reference_ids"
      - name: Report catalog coverage
        if: ${{ always() }}
        working-directory: backend
        run: timeout --signal=TERM --kill-after=30s 5m python -m enrichment.coverage_report --ufs "$MARKET_UFS"
