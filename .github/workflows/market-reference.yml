name: Regional market references

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Database environment
        type: choice
        required: true
        default: staging
        options: [staging, Production]
      ufs:
        description: Comma-separated UFs (blank covers every active UF)
        required: false
        default: ""
      limit:
        description: Maximum regions to refresh
        required: true
        default: "30"
  schedule:
    # GitHub cron uses UTC. Avoid the top of the hour, where GitHub documents
    # heavier scheduler load and possible delayed or dropped runs.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: regional-market-reference
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.target_environment || 'Production' }}
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Refresh missing or stale references
        working-directory: backend
        run: >-
          python -m enrichment.market_reference
          --ufs "${{ github.event.inputs.ufs || '' }}"
          --limit "${{ github.event.inputs.limit || '30' }}"
          --max-age-days 90
      - name: Materialize shared property analyses
        if: ${{ always() }}
        working-directory: backend
        run: >-
          python -m enrichment.materialize
          --ufs "${{ github.event.inputs.ufs || '' }}"
      - name: Report catalog coverage
        if: ${{ always() }}
        working-directory: backend
        run: python -m enrichment.coverage_report --ufs "${{ github.event.inputs.ufs || '' }}"
