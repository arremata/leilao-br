name: Regional market references

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Database environment
        type: choice
        required: true
        default: staging
        options: [staging, Production]
      ufs:
        description: Comma-separated UFs
        required: true
        default: PR
      limit:
        description: Maximum regions to refresh
        required: true
        default: "10"
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: read

concurrency:
  group: regional-market-reference
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.target_environment || 'Production' }}
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Refresh missing or stale references
        working-directory: backend
        run: >-
          python -m enrichment.market_reference
          --ufs "${{ github.event.inputs.ufs || 'PR' }}"
          --limit "${{ github.event.inputs.limit || '10' }}"
          --max-age-days 90
