name: Caixa ingestion

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Database environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - Production
      ufs:
        description: Comma-separated UFs to ingest
        required: true
        default: PR
      limit:
        description: Optional maximum listings per UF (empty means all)
        required: false
        default: ""
      geocode:
        description: Geocode new listings with Nominatim
        type: boolean
        required: true
        default: false
  schedule:
    # GitHub cron is UTC. 08:17 UTC is 05:17 in Brasilia standard time.
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: caixa-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Manual runs default to staging. Scheduled runs have no dispatch inputs,
    # so they always resolve to the Production environment.
    environment: ${{ github.event.inputs.target_environment || 'Production' }}
    env:
      # Deliberately differs from the legacy repository-level DATABASE_URL:
      # this must be configured separately in each GitHub Environment.
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      INGEST_UFS: ${{ github.event.inputs.ufs || 'PR' }}
      INGEST_LIMIT: ${{ github.event.inputs.limit || '' }}
      INGEST_GEOCODE: ${{ github.event.inputs.geocode || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Chrome for Playwright
        run: python -m playwright install --with-deps chrome

      - name: Validate database configuration
        run: test -n "$DATABASE_URL"

      - name: Run ingestion worker
        working-directory: backend
        shell: bash
        run: |
          args=(--ufs "$INGEST_UFS")
          if [[ -n "$INGEST_LIMIT" ]]; then
            args+=(--limit "$INGEST_LIMIT")
          fi
          if [[ "$INGEST_GEOCODE" == "true" ]]; then
            args+=(--geocode)
          fi
          xvfb-run -a python -m ingestion.worker "${args[@]}"

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Caixa ingestion failed"
            echo
            echo "UFs: \`$INGEST_UFS\`"
            echo "Review the worker logs above for the failed state and error."
          } >> "$GITHUB_STEP_SUMMARY"
