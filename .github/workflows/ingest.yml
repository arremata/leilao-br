name: Caixa ingestion

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Database environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - Production
      ufs:
        description: Comma-separated UFs to ingest
        required: true
        default: PR
      limit:
        description: Optional maximum listings per UF (empty means all)
        required: false
        default: ""
      detail_limit:
        description: Maximum Caixa detail pages to enrich in this run
        required: true
        default: "160"
  schedule:
    - cron: "50 8 * * *"
permissions:
  contents: read

concurrency:
  group: caixa-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Manual runs default to staging. Scheduled runs have no dispatch inputs,
    # so they resolve to the Production environment.
    environment: ${{ github.event.inputs.target_environment || 'Production' }}
    env:
      # Deliberately differs from the legacy repository-level DATABASE_URL:
      # this must be configured separately in each GitHub Environment.
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      INGEST_UFS: ${{ github.event.inputs.ufs || 'PR' }}
      INGEST_LIMIT: ${{ github.event.inputs.limit || '' }}
      INGEST_DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '160' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Chrome for Playwright
        run: python -m playwright install --with-deps chrome

      - name: Validate database configuration
        run: |
          test -n "$DATABASE_URL"
          [[ "$INGEST_UFS" =~ ^[A-Za-z]{2}(,[A-Za-z]{2})*$ ]]
          [[ -z "$INGEST_LIMIT" || "$INGEST_LIMIT" =~ ^[1-9][0-9]*$ ]]
          [[ "$INGEST_DETAIL_LIMIT" =~ ^[0-9]+$ ]]

      - name: Run ingestion worker
        working-directory: backend
        shell: bash
        run: |
          args=(
            --ufs "$INGEST_UFS"
            --date-limit "$INGEST_DETAIL_LIMIT"
            --result-file "$RUNNER_TEMP/ingestion-result.json"
          )
          if [[ -n "$INGEST_LIMIT" ]]; then
            args+=(--limit "$INGEST_LIMIT")
          fi
          xvfb-run -a python -m ingestion.worker "${args[@]}"

      - name: Report optional detail health
        if: ${{ always() }}
        working-directory: backend
        run: |
          result_file="$RUNNER_TEMP/ingestion-result.json"
          if [[ -s "$result_file" ]]; then
            python -m action_health ingestion "$result_file"
          fi

      - name: Refresh analyses changed by catalog ingestion
        working-directory: backend
        run: timeout --signal=TERM --kill-after=30s 10m python -m enrichment.materialize --ufs "$INGEST_UFS"

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Caixa ingestion failed"
            echo
            echo "UFs: \`$INGEST_UFS\`"
            echo "Review the worker logs for an authoritative catalog or infrastructure failure."
          } >> "$GITHUB_STEP_SUMMARY"
