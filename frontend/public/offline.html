<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f3" />
    <title>Arremate offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f7f3;
        color: #302c25;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 40px));
        border: 1px solid #e5e0d7;
        border-radius: 10px;
        background: #fff;
        padding: 28px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; color: #6d665b; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Arremate esta offline</h1>
      <p>Conecte-se novamente para atualizar dados de leiloes, riscos e analises.</p>
    </main>
  </body>
</html>
