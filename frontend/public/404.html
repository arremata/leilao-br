<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFA" />
    <title>Argos — página não encontrada</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #FAFAFA;
        color: #111827;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(460px, calc(100vw - 40px));
        border: 1px solid #E5E7EB;
        border-radius: 16px;
        background: #fff;
        padding: 32px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: #6B7280; line-height: 1.6; font-size: 14px; }
      a {
        display: inline-flex;
        align-items: center;
        height: 38px;
        padding: 0 18px;
        border-radius: 10px;
        background: #7C3AED;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Esta página não existe</h1>
      <p>O endereço pode estar incompleto ou ter sido digitado errado.</p>
      <a href="/">Ver os imóveis</a>
    </main>
  </body>
</html>
